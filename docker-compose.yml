version: '3.8'

services:
  neptune-plumbing:
    image: python:3.10-slim
    container_name: neptune-plumbing
    working_dir: /app
    volumes:
      - ./:/app
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./data:/app/data
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "
        pip install -r requirements.txt --break-system-packages &&
        streamlit run app.py --server.port=8501 --server.address=0.0.0.0
      "
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data:
